syntax = "proto3";

package temporal.server.chasm.lib.historydlq.proto.v1;

import "google/protobuf/timestamp.proto";
import "temporal/server/api/common/v1/dlq.proto";

option go_package = "go.temporal.io/server/chasm/lib/historydlq/gen/historydlqpb;historydlqpb";

// Resolution identifies the operation that removes a DLQ entry.
enum Resolution {
  RESOLUTION_UNSPECIFIED = 0; // No resolution was specified.
  RESOLUTION_MERGED = 1; // The task was accepted back into processing, but may still fail during execution.
  RESOLUTION_PURGED = 2; // The operator discarded the task without re-enqueueing it.
}

// TaskIdentity preserves the original persisted task's identity across DLQ retries.
message TaskIdentity {
  // Shard in the original source cluster, independent of DLQ placement.
  int32 source_shard_id = 1;
  // ID assigned when the original task was persisted.
  int64 task_id = 2;
  // Original execution namespace.
  string namespace_id = 3;
  // Original execution Business ID (Workflow ID for workflows).
  string business_id = 4;
  // Original execution Run ID.
  string run_id = 5;
  // Original execution archetype; zero is permitted for workflow tasks.
  uint32 archetype_id = 6;
}

// SegmentState contains the identity and storage budget of one producer-routed DLQ segment.
message SegmentState {
  // Queue whose entries are stored in this segment.
  temporal.server.api.common.v1.HistoryDLQKey queue = 1;
  // Source shard whose tasks belong to this segment.
  int32 source_shard_id = 2;
  // Conservative retained-byte budget, including metadata and framework reserves.
  int64 retained_bytes = 4;
  // Producer-hash bucket assigned to this segment.
  uint32 bucket_id = 5;
  // Smallest pending message ID, or -1 when the segment is empty.
  int64 min_message_id = 6;
}

// EntryState contains metadata for one task in a DLQ segment.
message EntryState {
  // Identity of the persisted task that this entry represents.
  TaskIdentity source_task_identity = 1;
  // Server-assigned numeric bound for operator requests; collisions are allowed.
  int64 message_id = 2;
  // Server time assigned once when the entry is accepted.
  google.protobuf.Timestamp enqueued_at = 3;
  // Serialized HistoryTask size, released from the segment budget on resolution.
  int64 payload_size_bytes = 7;
}

// MessageRef addresses one exact entry in a CHASM DLQ segment.
message MessageRef {
  // Stable segment Business ID derived from queue, source shard, and producer bucket.
  string business_id = 2;
  // Exact accepted segment run, required for reads and resolution.
  string run_id = 3;
  // Persisted numeric bound; different entries may have the same value.
  int64 message_id = 4;
  // Original DLQ queue identity.
  temporal.server.api.common.v1.HistoryDLQKey queue = 5;
  // Timestamp assigned once on durable admission.
  google.protobuf.Timestamp enqueued_at = 6;
  // Stable key for the exact entry in the segment.
  string entry_key = 7;
}

// StoredMessage contains authoritative metadata and the task DATA payload.
message StoredMessage {
  // Exact CHASM message reference.
  MessageRef ref = 1;
  // Original task identity and execution metadata, independent of DLQ placement.
  TaskIdentity source_task_identity = 2;
  // Serialized task and original source shard.
  temporal.server.api.common.v1.HistoryTask task = 5;
}

message EnqueueRequest {
  // Routing namespace, always the cluster-local temporal-system ID.
  string system_namespace_id = 1;
  // Routing Business ID derived from the queue, source shard, and producer bucket.
  string business_id = 2;
  // Queue containing this failed task.
  temporal.server.api.common.v1.HistoryDLQKey queue = 3;
  // Stable original persisted task identity and preserved execution metadata.
  TaskIdentity source_task_identity = 4;
  // Serialized failed task, retaining its original source shard.
  temporal.server.api.common.v1.HistoryTask task = 5;
}

message EnqueueResponse {
  // Accepted entry; retries reuse its ID and time while the entry exists.
  MessageRef ref = 1;
}

message ReadMessageRequest {
  // Routing namespace, always the cluster-local temporal-system ID.
  string system_namespace_id = 2;
  // Full execution reference, required even when numeric IDs collide.
  MessageRef ref = 1;
}

message ReadMessageResponse {
  // Authoritative metadata and payload for an existing entry.
  StoredMessage message = 1;
}

message ResolveRequest {
  // Segment Business ID, Run ID, entry key, and queue identify the entry.
  // Message ID and enqueue time are ignored.
  MessageRef ref = 1;
  // MERGED after re-enqueue acceptance, or PURGED without re-enqueue.
  Resolution resolution = 2;
  // Routing namespace, always the cluster-local temporal-system ID.
  string system_namespace_id = 4;
}

message ResolveResponse {}

// SegmentRef addresses one exact segment run in a logical queue.
message SegmentRef {
  // Queue whose authoritative metadata must match the segment.
  temporal.server.api.common.v1.HistoryDLQKey queue = 1;
  // Stable segment routing identity.
  string business_id = 2;
  // Exact execution run; a replacement run must not be substituted.
  string run_id = 3;
}

message ListEntriesRequest {
  // Cluster-local system namespace used for routing.
  string system_namespace_id = 1;
  // Exact segment run to inspect.
  SegmentRef segment = 2;
  // Inclusive numeric bound; unbounded reads use the largest int64.
  int64 inclusive_max_message_id = 3;
  // Maximum number of references; must be positive.
  int32 page_size = 4;
  // Opaque continuation bound to the segment and numeric bound.
  bytes next_page_token = 5;
}

message ListEntriesResponse {
  // Pending entry references in numeric ID and entry-key order, without task DATA.
  repeated MessageRef refs = 1;
  // Opaque continuation, empty when the current live view is exhausted.
  bytes next_page_token = 2;
}

message DescribeSegmentRequest {
  // Cluster-local system namespace used for routing.
  string system_namespace_id = 1;
  // Exact segment run to inspect.
  SegmentRef segment = 2;
}

message DescribeSegmentResponse {
  // Number of currently retained entries, independent of visibility flags.
  int64 pending_count = 1;
  // Largest currently retained numeric message ID, or zero if empty.
  int64 last_message_id = 2;
}

message ReadSegmentMessagesRequest {
  // Cluster-local system namespace used for routing.
  string system_namespace_id = 1;
  // Exact segment run to inspect.
  SegmentRef segment = 2;
  // Inclusive numeric bound; unbounded reads use the largest int64.
  int64 inclusive_max_message_id = 3;
  // Maximum number of messages; must be positive.
  int32 page_size = 4;
  // Entry continuation bound to the segment and numeric bound.
  bytes next_page_token = 5;
}

message ReadSegmentMessagesResponse {
  // Entry metadata and payloads copied in one segment read operation.
  repeated StoredMessage messages = 1;
  // Opaque continuation, empty when the current live view is exhausted.
  bytes next_page_token = 2;
}
